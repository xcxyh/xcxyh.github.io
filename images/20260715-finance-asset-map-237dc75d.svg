<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">家庭资产的 4+1 地图</title>
  <desc id="desc">现金、固定收益、权益、实物四类资产围绕保险保障组成家庭资产地图</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26323a" flood-opacity="0.10"/>
    </filter>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#384b56" opacity="0.08"/>
      <circle cx="13" cy="10" r="0.5" fill="#384b56" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="740" rx="28" fill="#f6f1e7"/>
  <rect width="1200" height="740" rx="28" fill="url(#paper)"/>

  <text x="70" y="76" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700">家庭资产的 4+1 地图</text>
  <text x="70" y="113" fill="#65737b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">每类钱有不同任务，保险负责兜住家庭承受不起的风险</text>

  <path d="M420 260 C500 270 520 300 550 340" fill="none" stroke="#c8c1b4" stroke-width="3" stroke-dasharray="7 9"/>
  <path d="M780 260 C700 270 680 300 650 340" fill="none" stroke="#c8c1b4" stroke-width="3" stroke-dasharray="7 9"/>
  <path d="M420 550 C500 520 520 470 550 430" fill="none" stroke="#c8c1b4" stroke-width="3" stroke-dasharray="7 9"/>
  <path d="M780 550 C700 520 680 470 650 430" fill="none" stroke="#c8c1b4" stroke-width="3" stroke-dasharray="7 9"/>

  <g filter="url(#shadow)">
    <rect x="70" y="158" width="350" height="190" rx="24" fill="#fffaf1"/>
    <circle cx="132" cy="220" r="36" fill="#d9a261"/>
    <rect x="111" y="207" width="42" height="28" rx="6" fill="none" stroke="#fffaf1" stroke-width="4"/>
    <path d="M119 207v-8h28v8M141 221h6" fill="none" stroke="#fffaf1" stroke-width="4" stroke-linecap="round"/>
    <text x="188" y="217" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">现金类</text>
    <text x="188" y="250" fill="#6c767c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">眼前生活 · 应急周转</text>
    <text x="110" y="307" fill="#8a6540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">重点：随时能用，不追求高收益</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="158" width="350" height="190" rx="24" fill="#f3f6f5"/>
    <circle cx="842" cy="220" r="36" fill="#718c82"/>
    <path d="M822 234h40M827 229v-27h30v27M833 202v-8h18v8M836 212h12M836 220h12" fill="none" stroke="#f3f6f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="898" y="217" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">固定收益类</text>
    <text x="898" y="250" fill="#6c767c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">中短期计划 · 降低波动</text>
    <text x="820" y="307" fill="#536a62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">重点：看期限、信用和赎回规则</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="470" width="350" height="190" rx="24" fill="#f1f4f7"/>
    <circle cx="132" cy="532" r="36" fill="#5d7894"/>
    <path d="M111 548h42M116 543v-18M128 543v-29M140 543v-10M152 543v-38" fill="none" stroke="#f1f4f7" stroke-width="4" stroke-linecap="round"/>
    <text x="188" y="529" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">权益类</text>
    <text x="188" y="562" fill="#6c767c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">长期资金 · 参与增长</text>
    <text x="110" y="619" fill="#4b647c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">重点：分散持有，接受价格波动</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="470" width="350" height="190" rx="24" fill="#f8efe9"/>
    <circle cx="842" cy="532" r="36" fill="#b66f52"/>
    <path d="M820 535l22-20 22 20M825 532v20h34v-20M838 552v-13h9v13" fill="none" stroke="#f8efe9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="898" y="529" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">实物及相关资产</text>
    <text x="898" y="562" fill="#6c767c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">居住需求 · 资产储藏</text>
    <text x="820" y="619" fill="#885540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">重点：金额大，变现通常较慢</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="600" cy="390" r="120" fill="#fffaf1"/>
    <path d="M600 303l48 18v32c0 32-20 56-48 70-28-14-48-38-48-70v-32z" fill="#dbe4df" stroke="#718c82" stroke-width="5"/>
    <path d="M580 358l14 14 28-32" fill="none" stroke="#526d63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="461" text-anchor="middle" fill="#26323a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">+1 保险保障</text>
    <text x="600" y="490" text-anchor="middle" fill="#65737b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16">转移家庭扛不住的风险</text>
  </g>
</svg>
